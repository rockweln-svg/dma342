<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign Up | WNY Flash Academy</title><link rel="stylesheet" href="styles.css"></head>
<body class="sub-page signup-page">
<header class="page-top left-title"><a class="back-link" href="index.html" aria-label="Back to home">←</a><h1>Sign Up</h1></header>
<main class="signup-layout"><form class="signup-form" id="signup-form">
<label for="program">Select program</label><select id="program" name="program" required><option value="">Select program</option><option>Junior Academy</option><option>Youth Travel Team</option><option>Premier Travel / Regional Teams</option><option>Elite Clubs National League Program</option></select>
<label for="age">Enter Age</label><select id="age" name="age" required><option value="">Select age</option><option>6–8</option><option>9–12</option><option>13–15</option><option>16–19</option></select>
<label for="level">Level of experience</label><select id="level" name="level" required><option value="">Select level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Competitive club player</option></select>
<fieldset><legend>Gender</legend><label class="check-label"><input type="radio" name="gender" value="Male" required> Male</label><label class="check-label"><input type="radio" name="gender" value="Female"> Female</label><label class="check-label"><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label></fieldset>
<label for="email">Email</label><input id="email" name="email" type="email" placeholder="Enter Email" required>
<button class="button submit-button" type="submit">Sign up!</button><p class="form-message" id="form-message" role="status"></p>
</form><div class="soccer-art" aria-hidden="true">⚽</div></main>
<footer class="site-footer"><a class="mini-brand" href="index.html">Flash</a><div class="socials"><a href="#" aria-label="Instagram">◎</a><a href="#" aria-label="Facebook">f</a><a href="#" aria-label="YouTube">▶</a></div></footer><script src="script.js"></script></body></html>
